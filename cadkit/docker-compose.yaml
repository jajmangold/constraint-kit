# cadkit: CPU-only geometry+planning service. No GPU reservation (OCC is CPU). The planner/VLM is an
# LLM API it CALLS (DeepSeek by default; any OpenAI-compatible server via LLM_BASE_URL).
#
# network_mode: host lets cadkit reach optional local services bound to 127.0.0.1 (a local LLM
# server, Neo4j, SearXNG) without extra port mapping.
#
#   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose -f cadkit/docker-compose.yaml up -d --build
#   API: http://127.0.0.1:8195
name: cadkit

services:
  cadkit:
    build:
      context: .
      dockerfile: Dockerfile
    image: cadkit:0.1
    container_name: cadkit
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    network_mode: host
    working_dir: ${CK_WORK_DIR:-/tmp/constraint-kit}
    volumes:
      - ${CK_WORK_DIR:-/tmp/constraint-kit}:${CK_WORK_DIR:-/tmp/constraint-kit}
    environment:
      PYTHONPATH: ${CK_WORK_DIR:-/tmp/constraint-kit}
      PYTHONUNBUFFERED: "1"
      OUTPUT_DIR: ${CK_WORK_DIR:-/tmp/constraint-kit}/cadkit/output
      # LLM backend: DeepSeek by default. Set LLM_BASE_URL to a local OpenAI-compatible server to self-host.
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      MODEL_PLANNER: "${MODEL_PLANNER:-deepseek-v4-pro}"
      # vision QA + table extraction need an image-capable model
      MODEL_VLM: "${MODEL_VLM:-deepseek-flash}"
      # atlas (optional Neo4j) -- persist all work; fail-soft if absent. Reachable via host net namespace.
      NEO4J_URL: "bolt://127.0.0.1:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASS: "${NEO4J_PASS:-changeme}"
      # spec compiler (engineering-fact resolution): SQLite store + SearXNG discovery + vision model
      SPEC_SEARCH_URL: "http://localhost:8080"
      SPEC_DB_PATH: "${CK_WORK_DIR:-/tmp/constraint-kit}/cadkit/output/specs.sqlite"
      SPEC_CACHE_DIR: "${CK_WORK_DIR:-/tmp/constraint-kit}/cadkit/output/spec_cache"
      # design-version provenance (T8.1): .git is NOT bind-mounted, so pass the host SHA through.
      # Set it at up-time: CK_GIT_SHA=$(git rev-parse --short HEAD) docker compose ... up -d
      CK_GIT_SHA: "${CK_GIT_SHA:-}"
      HOME: /tmp
    command: >
      uvicorn constraint_kit.api:app --host 127.0.0.1 --port 8195
    restart: unless-stopped
