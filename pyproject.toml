[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "constraint-kit"
version = "0.1.0"
description = "Generate exact parametric CAD assemblies from natural language"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "jajmangold" }]
keywords = ["cad", "parametric", "assembly", "b-rep", "llm", "deterministic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Computer Aided Design (CAD)",
]

dependencies = [
    "cadquery",
    "build123d",
    "numpy",
    "trimesh",
    "ezdxf",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "neo4j",
    "langgraph",
    "beautifulsoup4",
    "pypdf",
    "z3-solver",
]

[project.optional-dependencies]
dev = ["pytest"]
gear = ["cq-gears @ git+https://github.com/meadiode/cq_gears.git"]
catalog = ["bd-warehouse"]
pdf = ["pdf-oxide"]
solver = ["python-solvespace"]
training = ["unsloth", "trl", "peft", "bitsandbytes"]
all = ["constraint-kit[gear,catalog,pdf,solver,training,dev]"]

[project.urls]
Homepage = "https://github.com/jajmangold/constraint-kit"
Repository = "https://github.com/jajmangold/constraint-kit"

[tool.hatch.build.targets.wheel]
packages = ["constraint_kit"]
