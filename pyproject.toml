[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "constraint-kit"
version = "0.1.0"
description = "Generate exact parametric CAD assemblies from natural language"
readme = "README.md"
license = "MIT"
# 3.11, not higher: FreeCAD 1.0 bundles Python 3.11.13 and the workbench runs inside it. A
# floor above that would declare the workbench unsupported by its own package metadata.
requires-python = ">=3.11"
authors = [{ name = "jajmangold" }]
keywords = ["cad", "parametric", "assembly", "b-rep", "llm", "deterministic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Computer Aided Design (CAD)",
]

# THE BASE INSTALL IS THE CORE TIER AND NOTHING ELSE.
#
# This used to be one list of fifteen packages, and it was wrong in a way a version bump could
# not fix: `pip install constraint-kit` pulled cadquery, fastapi, neo4j and langgraph on somebody
# who wanted only the physics tier -- the tier whose entire value is that it needs none of them,
# because it has to run inside FreeCAD's own interpreter where pip is not available.
#
# So the base is what `constraint_kit.fea`, `constraint_kit.optimise`, `constraint_kit.manufacture`
# and `constraint_kit.parameters` actually need, and `tests/test_packaging.py` reads the imports
# and fails if anything creeps back in. Everything heavier is an extra that says what it is for.
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
# The cadquery kernel. PINNED, and the pins match cadkit/Dockerfile exactly, because the
# container is the only place this stack has ever been run: 113 kernel tests pass in there and
# nowhere else. On a bare host the same suite reports 86/113 with 27 import failures, which is
# expected rather than a regression. A disagreement between these pins and the Dockerfile would
# mean the test count was measured against a different stack than the one declared, so
# `tests/test_packaging.py` compares them.
kernel = [
    "cadquery==2.7.0",
    "build123d==0.10.0",
    "ocp_gordon==0.1.18",
    "bd_warehouse==0.2.0",
    "trimesh",
    "ezdxf",
]
# The FastAPI service, the atlas persistence and the spec compiler. Separate from the kernel
# because the kernel is usable as a library with no service running.
service = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "neo4j",
    "langgraph",
    "beautifulsoup4",
    "pypdf",
]
solver = ["z3-solver", "python-solvespace"]
# Algebraic multigrid for the voxel CG (#5). Optional on purpose: the physics tier has to import
# inside FreeCAD, where pip is not available. And off by default even when present -- it wins on
# iterations and loses on wall clock below ~150k DOF; see fea/voxel.py::AMG_DOF_FLOOR.
amg = ["pyamg"]
gear = ["cq-gears @ git+https://github.com/meadiode/cq_gears.git"]
pdf = ["pdf-oxide"]
dev = ["pytest"]
# GPU, and deliberately not in `all`: installing bitsandbytes on a machine with no CUDA is a
# long way to an error message.
training = ["unsloth", "trl", "peft", "bitsandbytes"]
all = ["constraint-kit[kernel,service,solver,amg,gear,pdf,dev]"]

[project.urls]
Homepage = "https://github.com/jajmangold/constraint-kit"
Repository = "https://github.com/jajmangold/constraint-kit"

[tool.hatch.build.targets.wheel]
packages = ["constraint_kit"]
